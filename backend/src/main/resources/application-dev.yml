# ============================================================
#  application-dev.yml  — LOCAL DEVELOPMENT ONLY
# ============================================================

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/pharmacy_pos
    username: postgres
    password: 1234
    hikari:
      maximum-pool-size: 5
      pool-name: PharmacyPOS-Dev-Pool

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    show-sql: true

logging:
  level:
    com.pharmacy.pos: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE   # Shows bound SQL parameters

server:
  port: 8080
