# ============================================================
#  pharmacy-pos  |  application.yml
#  Shared config loaded for ALL profiles.
#  Profile-specific files override individual keys.
# ============================================================

spring:
  application:
    name: pharmacy-pos

  # ── Active profile (override via env var SPRING_PROFILES_ACTIVE) ──
  profiles:
    active: dev

  # ── JPA / Hibernate ──────────────────────────────────────────────
  jpa:
    open-in-view: false          # Prevents lazy-loading anti-pattern
    hibernate:
      ddl-auto: validate         # Flyway owns the schema; Hibernate just validates
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
        # Envers audit table suffix
        org.hibernate.envers.audit_table_suffix: _audit_log
        org.hibernate.envers.revision_field_name: revision_id
        org.hibernate.envers.revision_type_field_name: revision_type

  # ── Flyway ───────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # ── Redis ────────────────────────────────────────────────────────
  data:
    redis:
      timeout: 2000ms

  # ── Jackson ──────────────────────────────────────────────────────
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# ── Application-level settings ───────────────────────────────────
app:
  jwt:
    # Override JWT_SECRET env var in prod — never commit a real secret
    secret: ${JWT_SECRET:fa31ac3ed45bda3ab35a77332f207e7ddc69fe7fd480463cc7041d0a8f3af098}
    access-token-expiry-ms: 900000        # 15 minutes
    refresh-token-expiry-ms: 604800000    # 7 days

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  pagination:
    default-page-size: 20
    max-page-size: 100

# ── Actuator (health checks for Docker / load balancer) ──────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# ── OpenAPI / Swagger ─────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  default-produces-media-type: application/json
